const NAMES = {all:"전체", split:"위아래 분리", fold:"접는 것", code:"코드블록", multi:"여러 줄", line:"한 줄 추가", rule:"규칙 있음", rofan:"로판AI", tip:"팁"};
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const SC = `잭스는 붕대 끝을 이로 끊어 내려다 말고, 네 손에 팔을 맡긴 채 창밖으로 고개를 돌렸다.\n"……살살 해. 그거 다 청구서에 올라가."`;
let cur = "all";
function draw(){
  document.getElementById("filters").innerHTML = Object.entries(NAMES).map(([k,v])=>`<button class="${k===cur?'on':''}" data-f="${k}">${v} ${k==='all'?V.length:V.filter(x=>x.k.includes(k)).length}</button>`).join("");
  document.getElementById("list").innerHTML = V.map((v,i)=>({v,i})).filter(({v})=>cur==="all"||v.k.includes(cur)).map(({v,i})=>`<section>
    <div class="hd"><div class="rank"><b>${i+1}</b><span>위</span></div><div style="flex:1;min-width:0">
      <h2><a href="${G(v.n)}" target="_blank" rel="noopener">${esc(v.t)}</a></h2>
      <div class="stat"><span class="r">추천 ${v.r}</span><span>조회 ${v.v.toLocaleString()}</span><span>AI 채팅 마이너 갤러리</span></div>
      <div class="tags">${v.hot?`<span style="background:#ffe9ea;color:#e5484d">${v.hot}</span>`:""}${v.k.filter(k=>k!=="rofan").map(k=>`<span>${NAMES[k]}</span>`).join("")}</div>
    </div></div>
    <ul class="pts">${v.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
    ${v.top||v.bot?`<div class="lab">잭스로 채우면</div><div class="chat"><div class="msg"><div class="av" style="background-image:url('${AV}')"></div><div style="min-width:0;flex:1"><div class="nm">잭스</div><div class="bub">${v.top?v.top+"\n":""}${esc(SC)}${v.bot?"\n\n"+v.bot:""}</div></div></div></div>`:""}
    <div class="lab">양식 <button data-i="${i}">복사</button></div>
    <pre>${esc(v.tpl)}</pre></section>`).join("");
}
draw();
document.addEventListener("click",(e)=>{
  const f=e.target.closest("button[data-f]"); if(f){cur=f.dataset.f;draw();return;}
  const b=e.target.closest("button[data-i]"); if(!b) return;
  navigator.clipboard.writeText(V[b.dataset.i].tpl).then(()=>{b.textContent="복사됨";b.classList.add("ok");setTimeout(()=>{b.textContent="복사";b.classList.remove("ok")},1400)});
});
</script>
